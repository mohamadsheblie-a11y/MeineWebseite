<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Meine erste Webseite</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #4005e2;
            text-align: center;
            padding: 50px;
        }
        
        .karte {
            background: rgb(229, 250, 237);
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #9e0303;
        }
        
        p {
            color: #030405;
            font-size: 18px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="karte">

        <h1>Hallo! 👋</h1>

        <p>Ich studiere Allgemeine Informatik.</p>

        <p>Das ist meine erste Webseite!</p>

        <button onclick="alert('Du hast den Button geklickt!')">
            Klick mich
        </button>

    </div>

</body>
